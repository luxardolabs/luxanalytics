# luxlint — fleet code-style + type standard (sibling of .luxarch.toml).
# Carries only where to look + the repo's facts; the ruff/mypy config lives in the image.
# Run via `make lint` / `make mypy`; schema: `luxlint --doc REFERENCE`.

[source]
# tests/, alembic/ and scripts/ are first-party code we maintain, so they are style-held like app/.
paths = ["app", "tests", "alembic", "scripts"]

# Python 3.14 app (Dockerfile: python:3.14-slim) — check ruff/mypy at 3.14.
[python]
target = "py314"

# First-party JS lives at the canonical app/static/js; third-party is under app/static/vendor.
[js]
source_type = "script"
ecma_version = "2022"
globals = ["htmx", "Alpine", "Chart", "echarts"]

# The ONE sanctioned third-party deprecation carve-out for slowapi, verbatim from
# luxarch --doc FLEET-RATE-LIMIT-STANDARD §4 (scoped to the exact message AND module).
[[pytest.filterwarnings_ignore]]
warning = "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension"
reason = "slowapi 0.1.10 Limiter.limit calls the deprecated asyncio.iscoroutinefunction (upstream laurentS/slowapi#263, fix PRs unmerged). Scoped to the exact message AND module. REMOVE when slowapi ships the fix — on Python 3.16 the call becomes an AttributeError at startup, so this carve-out is a deadline, not a resolution. See luxarch --doc FLEET-RATE-LIMIT-STANDARD §4. Tracked in LUXANALYTI-60."

# The coverage ratchet (luxlint --coverage-ratchet, run by the emitted `make test` block): the
# measured BRANCH coverage of app/ may never drop below this floor. Raise it when coverage improves;
# never lower it. 84% measured 2026-10-08 (175 tests, coverage.py --branch, COVERAGE_CORE=sysmon).
[test]
coverage_min = 84
