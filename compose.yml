# ONE stack for every environment (luxarch --doc FLEET-BUILD-DEPLOY-STANDARD, "Compose: one way,
# known"):   docker compose --env-file .env.<env> up -d
# Environments differ only by .env.<env> (template: .env.example). The dev-only nginx runs under the
# `dev` profile (COMPOSE_PROFILES=dev in .env.dev); prod sits behind the host's nginx instead.
# Compose never builds: the app is the immutable image `make dev-deploy` / `make release` pushed,
# pinned as TAG in .env.<env>. Logs are JSON on stdout (the fleet logging module).
name: luxanalytics

services:
  luxanalytics_db:
    image: postgres:16-alpine
    container_name: luxanalytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxanalytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.<env>}
      POSTGRES_DB: luxanalytics
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    # Sized to the data, measured on prod 2026-10-08 (LUXANALYTI-19): 104 MB of events, so 256 MB of
    # shared buffers holds all of it; the node has 31 GB shared with ~10 other containers.
    # pg_stat_statements is preloaded so slow queries are visible (CREATE EXTENSION to read it).
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
    volumes:
      - luxanalytics_postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxanalytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxardolabs

  luxanalytics_redis:
    image: redis:7-alpine
    container_name: luxanalytics_redis
    restart: unless-stopped
    volumes:
      - luxanalytics_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxardolabs

  luxanalytics_app:
    image: ${REGISTRY:?set REGISTRY in .env.<env>}/luxardolabs/luxanalytics:${TAG:?make dev-deploy / make prod-deploy pins TAG in .env.<env>}
    container_name: luxanalytics_app
    restart: unless-stopped
    env_file:
      - .env.${DEPLOY_ENV:?set DEPLOY_ENV (dev|prod) in .env.<env>}
    expose:
      - "4000"
    depends_on:
      luxanalytics_db:
        condition: service_healthy
      luxanalytics_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - luxardolabs

  # Dev only: TLS on https://localhost:4000. A pass-through proxy; the app serves /static.
  luxanalytics_nginx:
    image: nginx:alpine
    container_name: luxanalytics_nginx
    profiles: ["dev"]
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS certificates from the host: TLS_CERTS_DIR in .env.dev
      - ${TLS_CERTS_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    ports:
      - "4000:4000"
    depends_on:
      luxanalytics_app:
        condition: service_healthy
    networks:
      - luxardolabs

  # Daily pg_dump with 14-day rotation (LUXANALYTI-14), on when COMPOSE_PROFILES includes `backup`
  # (prod). Dumps land in ./backups beside the stack; `make prod-backup` still pulls one off-node.
  luxanalytics_backup:
    image: postgres:16-alpine
    container_name: luxanalytics_backup
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      luxanalytics_db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.<env>}
    volumes:
      - ./backups:/backups
    tmpfs:
      - /var/lib/postgresql/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -o pipefail
        while :; do
          f=/backups/luxanalytics-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          if pg_dump -h luxanalytics_db -U luxanalytics luxanalytics | gzip > "$$f.part"; then
            mv "$$f.part" "$$f"; echo "backup written: $$f"
          else
            rm -f "$$f.part"; echo "backup FAILED" >&2
          fi
          find /backups -name 'luxanalytics-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    networks:
      - luxardolabs

  # `make test` only (luxarch --emit test-block): throwaway services in an isolated per-run compose
  # project. No container_name, no host port, no named volume, no shared network: they can never
  # touch the dev stack, and every run's teardown removes exactly its own.
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Over TCP with the real role: over the socket it answers while initdb's temporary server runs.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "test", "-d", "test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  # External, named per environment: a typo can never mint an empty database.
  luxanalytics_postgres_data:
    name: ${POSTGRES_VOLUME:?set POSTGRES_VOLUME in .env.<env>}
    external: true
  luxanalytics_redis_data:
    name: ${REDIS_VOLUME:?set REDIS_VOLUME in .env.<env>}

networks:
  # The fleet's shared network (make network creates it on a fresh host).
  luxardolabs:
    name: luxardolabs
    external: true
