# Pinned project name: volumes and networks never track the checkout directory.
name: luxanalytics

services:
  luxanalytics_db:
    image: postgres:16-alpine
    container_name: luxanalytics_db
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    volumes:
      - luxanalytics_postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxanalytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxanalytics_network

  luxanalytics_redis:
    image: redis:7-alpine
    container_name: luxanalytics_redis
    restart: unless-stopped
    volumes:
      - luxanalytics_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxanalytics_network

  luxanalytics_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxanalytics_app
    restart: unless-stopped
    env_file:
      - .env.dev
    expose:
      - "4000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
    depends_on:
      luxanalytics_db:
        condition: service_healthy
      luxanalytics_redis:
        condition: service_healthy
    command: >
      sh -c "
        uvicorn app.main:app --host 0.0.0.0 --port 4000 --reload
      "
    networks:
      - luxanalytics_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: luxanalytics_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app/static:/usr/share/nginx/html/static:ro
      # TLS certificates from the host: TLS_CERTS_DIR in Makefile.local (exported by make)
      - ${TLS_CERTS_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
    ports:
      - "4000:4000"
    networks:
      - luxanalytics_network
    depends_on:
      luxanalytics_app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  luxanalytics_postgres_data:
    name: luxanalytics_postgres_data
    external: true
  luxanalytics_redis_data:

networks:
  luxanalytics_network:
    driver: bridge
