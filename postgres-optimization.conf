# PostgreSQL Configuration for High-Load Analytics API
# Place this file in PostgreSQL's conf.d directory or include in postgresql.conf

# Connection Settings
max_connections = 500                    # Support multiple app instances with 100 connections each
superuser_reserved_connections = 3       # Reserve connections for maintenance

# Memory Settings (adjust based on available RAM)
shared_buffers = 4GB                     # 25% of total RAM (assuming 16GB)
effective_cache_size = 12GB              # 75% of total RAM
maintenance_work_mem = 512MB             # For VACUUM, CREATE INDEX, etc.
work_mem = 16MB                          # Per operation memory (be careful with this)
wal_buffers = 16MB                       # Write-ahead log buffers

# Checkpoint Settings
checkpoint_completion_target = 0.9       # Spread out checkpoint I/O
checkpoint_timeout = 15min               # Maximum time between checkpoints
max_wal_size = 4GB                       # Maximum WAL size before checkpoint
min_wal_size = 1GB                       # Minimum WAL size

# Query Planner
random_page_cost = 1.1                   # For SSD storage (default is 4.0 for HDD)
effective_io_concurrency = 200           # For SSD storage
default_statistics_target = 100          # More accurate query plans

# Logging and Monitoring
log_min_duration_statement = 1000        # Log queries longer than 1 second
log_checkpoints = on                     # Log checkpoint activity
log_connections = off                    # Don't log every connection (too noisy)
log_disconnections = off                 # Don't log every disconnection
log_lock_waits = on                      # Log lock waits
log_temp_files = 0                       # Log all temp file usage
log_autovacuum_min_duration = 0         # Log all autovacuum activity

# Performance
synchronous_commit = off                 # Trade durability for performance (analytics data)
full_page_writes = on                    # Required for data integrity
wal_compression = on                     # Compress WAL records

# Connection Handling
tcp_keepalives_idle = 60                # Detect dead connections faster
tcp_keepalives_interval = 10             
tcp_keepalives_count = 6

# Autovacuum (important for write-heavy workloads)
autovacuum = on
autovacuum_max_workers = 4               # More workers for large databases
autovacuum_naptime = 30s                 # Check for work more frequently
autovacuum_vacuum_scale_factor = 0.1     # Vacuum when 10% dead tuples
autovacuum_analyze_scale_factor = 0.05   # Analyze when 5% changed

# Statement Timeout
statement_timeout = 30000                # 30 seconds max query time
lock_timeout = 10000                     # 10 seconds max lock wait
idle_in_transaction_session_timeout = 180000  # 3 minutes - kill idle transactions
idle_session_timeout = 0                # Disabled - let connection pool manage this

# Extension
shared_preload_libraries = 'pg_stat_statements'  # For query performance monitoring