[project]
name = "luxanalytics"
description = "Analytics Event Collector API"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.14"
# The VERSION file is the ONE version literal (repo.version_single_source); hatchling reads it.
# Dependencies stay in [tool.poetry.dependencies] — Poetry is still the manager and owns the lock.
dynamic = ["version", "dependencies"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.poetry]
# Poetry manages dependencies and the lock only; the app is never installed as a package
# (the image runs `poetry install --no-root`). Packaging metadata lives in [project] + hatchling.
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"

# Core
# Floors: the fleet dependency floor (repo.fleet_dep_floor) and the CVE fix versions luxaudit names.
# A transitive CVE fix needs an explicit FLOOR here, or a re-lock resolves straight back to it.
fastapi = ">=0.141"
starlette = ">=1.3.1"
uvicorn = {extras = ["standard"], version = ">=0.52"}
pydantic = "^2.10"
pydantic-settings = "^2.7"
python-dotenv = "^1.0"
python-multipart = ">=0.0.31"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.1"}
asyncpg = ">=0.30"
alembic = "^1.14"

# Security
itsdangerous = "^2.2"
slowapi = "^0.1"

# Caching
redis = "^5.2"

# Templates
jinja2 = "^3.1"
aiofiles = "^24.1"

# Logging & Monitoring
structlog = "^25.1"
python-json-logger = "^3.2"
prometheus-client = "^0.21"

# OpenTelemetry
opentelemetry-api = "^1.29"
opentelemetry-sdk = "^1.29"
opentelemetry-instrumentation-fastapi = "^0.50b0"
opentelemetry-instrumentation-sqlalchemy = "^0.50b0"
opentelemetry-exporter-otlp = "^1.29"

# Performance
orjson = "^3.10"

[tool.poetry.group.dev.dependencies]
# Test tooling only: ruff/mypy are the guards' (luxlint runs them mount-only), never a repo dep.
pytest = ">=9.0.3"
pytest-asyncio = ">=0.24"
httpx = "^0.28"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
