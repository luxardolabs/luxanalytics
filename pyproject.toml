[tool.poetry]
name = "luxanalytics"
version = "1.0.3"
description = "Analytics Event Collector API"
authors = ["LuxardoLabs <admin@luxardolabs.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.14"

# Core
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
pydantic = "^2.10"
pydantic-settings = "^2.7"
python-dotenv = "^1.0"
python-multipart = "^0.0.18"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
psycopg = {extras = ["binary", "pool"], version = "^3.2"}
alembic = "^1.14"

# Security
itsdangerous = "^2.2"
slowapi = "^0.1"

# Caching
redis = "^5.2"

# Templates
jinja2 = "^3.1"
aiofiles = "^24.1"

# Logging & Monitoring
structlog = "^25.1"
python-json-logger = "^3.2"
prometheus-client = "^0.21"

# OpenTelemetry
opentelemetry-api = "^1.29"
opentelemetry-sdk = "^1.29"
opentelemetry-instrumentation-fastapi = "^0.50b0"
opentelemetry-instrumentation-sqlalchemy = "^0.50b0"
opentelemetry-exporter-otlp = "^1.29"

# Performance
orjson = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.28"
testcontainers = {extras = ["postgres"], version = "^4.8"}
ruff = "^0.8"
mypy = "^1.13"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
no_strict_optional = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
