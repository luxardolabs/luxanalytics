# Architecture-conformance config for luxarch (the fleet arch guard).
# Run via `make arch`; schema: `luxarch --doc REFERENCE`.
#
# Facts only. No allowlist entries: every one needs a written evidence line, and none has
# been earned yet. Reds stay red and are tracked in LuxPM (LUXANALYTI-42 onboarding).

[[target]]
kind = "fastapi-web"
app = "app"

# How mutating routes are authenticated (luxarch --playbook route-auth). Facts, not exemptions:
# the dashboard session dependency and the three ingest credentials.
[auth]
deps = ["require_auth", "verify_hmac_signature", "extract_app_from_dsn", "verify_project_dsn"]
