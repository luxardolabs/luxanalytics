# Upstream for LuxAnalytics Application
upstream luxanalytics_app {
    server luxanalytics_app:4000;
}

# HTTPS server on port 4000
server {
    listen 4000 ssl http2;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers handled by app middleware (SecurityHeadersMiddleware)

    # Max upload size (for event batches)
    client_max_body_size 10M;

    # Real IP from proxy
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;  # Docker internal networks
    set_real_ip_from 10.0.0.0/8;     # Private networks
    real_ip_recursive on;

    # Static files — served directly by nginx
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            add_header Access-Control-Allow-Origin *;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Event collection API — high throughput path
    location /api/v1/events/ {
        proxy_pass http://luxanalytics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check
    location /health {
        proxy_pass http://luxanalytics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # Prometheus metrics
    location /metrics {
        proxy_pass http://luxanalytics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # Web UI + dashboard + all other routes
    location / {
        proxy_pass http://luxanalytics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Pass HTMX headers through
        proxy_set_header HX-Request $http_hx_request;
        proxy_set_header HX-Trigger $http_hx_trigger;
        proxy_set_header HX-Target $http_hx_target;
        proxy_set_header HX-Current-URL $http_hx_current_url;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
