# Upstream for LuxAnalytics Application
upstream luxanalytics_app {
    # The app's pinned address on luxanalytics_front, never its name (compose.yml says why).
    server 172.28.44.20:4000;
}

# Any other name: no TLS handshake for an unknown SNI, and 421 for a request whose Host is not the
# dev name, so only the dev name reaches the app.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
    return 421;
}

# HTTPS on 443 for the dev name: the dev host's edge hands each request for it to this server at
# its pinned dev-edge address, with the client's Host and SNI (luxarch --doc
# FLEET-BUILD-DEPLOY-STANDARD, "The dev host").
server {
    listen 443 ssl;
    http2 on;
    server_name dev-analytics.luxardolabs.com;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers handled by app middleware (SecurityHeadersMiddleware)

    # Max upload size (for event batches)
    client_max_body_size 10M;

    # The client's address from the dev edge alone, by its fixed address on dev-edge. Never the
    # network: every app's front joins it, so any of them could choose the client address.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.30.0.2;

    # Event collection API — high throughput path
    location /api/v1/events/ {
        proxy_pass http://luxanalytics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Liveness and metrics are INTERNAL: the container health check calls localhost:4000 inside the
    # container, and Prometheus scrapes luxanalytics_app:4000 on the docker network (same in dev). Never public.
    # A regex location, so it wins over `location /` and covers /health/ and /metrics/ too.
    location ~ ^/(health|metrics)(/|$) {
        return 404;
    }

    # Web UI + dashboard + all other routes
    location / {
        proxy_pass http://luxanalytics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Pass HTMX headers through
        proxy_set_header HX-Request $http_hx_request;
        proxy_set_header HX-Trigger $http_hx_trigger;
        proxy_set_header HX-Target $http_hx_target;
        proxy_set_header HX-Current-URL $http_hx_current_url;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
