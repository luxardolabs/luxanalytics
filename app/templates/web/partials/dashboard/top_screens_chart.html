{% from "macros/layout.html" import empty_state_compact %}

{% if bar_data %}

<div class="h-[250px]"
     data-echart-config='{{ {
         "backgroundColor": "transparent",
         "tooltip": {"trigger": "axis", "axisPointer": {"type": "shadow"}},
         "grid": {"left": 120, "right": 20, "top": 10, "bottom": 20},
         "xAxis": {"type": "value", "axisLabel": {"color": "#64748b"}, "splitLine": {"lineStyle": {"color": "#282828"}}},
         "yAxis": {"type": "category", "data": bar_labels, "axisLabel": {"color": "#94a3b8", "fontSize": 11}, "axisLine": {"show": false}, "axisTick": {"show": false}},
         "series": [{
             "type": "bar",
             "data": bar_data,
             "itemStyle": {"color": "#ffa500", "borderRadius": [0, 4, 4, 0]},
             "barWidth": "60%"
         }]
     } | tojson_safe }}'></div>
{% else %}
{{ empty_state_compact("No screen data") }}
{% endif %}
