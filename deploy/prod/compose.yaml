services:
  luxanalytics_app:
    # The registry host is private; the ref (an immutable version tag) lives in .env.prod.
    image: ${LUXANALYTICS_IMAGE:?set LUXANALYTICS_IMAGE in .env.prod}
    container_name: luxanalytics_app
    restart: always
    env_file:
      - .env.prod
    expose:
      - "4000"
    depends_on:
      luxanalytics_db:
        condition: service_healthy
      luxanalytics_redis:
        condition: service_healthy
    networks:
      - luxardolabs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: docker.{{.Name}}

  luxanalytics_db:
    image: postgres:16-alpine
    container_name: luxanalytics_db
    restart: always
    environment:
      POSTGRES_USER: luxanalytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: luxanalytics
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    expose:
      - "5432"
    volumes:
      - luxanalytics-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxanalytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxardolabs
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: docker.{{.Name}}

  luxanalytics_redis:
    image: redis:7-alpine
    container_name: luxanalytics_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - luxanalytics-redis-data:/data
    networks:
      - luxardolabs
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: docker.{{.Name}}

volumes:
  luxanalytics-postgres-data:
    name: luxanalytics-postgres-data
  luxanalytics-redis-data:
    name: luxanalytics-redis-data

networks:
  luxardolabs:
    name: luxardolabs
    external: true
