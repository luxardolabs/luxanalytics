server {
    listen              443 ssl;
    server_name         analytics.luxardolabs.com;

    ssl_certificate     /etc/nginx/certs/luxardolabs.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/luxardolabs.com.privkey.pem;

    client_max_body_size 10M;  # Allow analytics payload uploads

    access_log          /var/log/nginx/analytics.luxardolabs.com.access.log json;
    error_log           /var/log/nginx/analytics.luxardolabs.com.error.log warn;

    # Enable Docker network resolution
    resolver 127.0.0.11 valid=10s;

    # Security hardening
    include /etc/nginx/includes/security.conf;

    # Analytics API endpoints
    location /api/ {
        proxy_pass http://luxanalytics_app:4000;
        include /etc/nginx/includes/proxy.conf;
    }

    # Dashboard and static assets
    location / {
        proxy_pass http://luxanalytics_app:4000;
        include /etc/nginx/includes/proxy.conf;
    }

    # Health check endpoint (optional - can be exposed or restricted)
    location /health {
        proxy_pass http://luxanalytics_app:4000;
        include /etc/nginx/includes/proxy.conf;
        
        # Optional: Restrict to internal networks only
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
    }

    include /etc/nginx/includes/general.conf;
}
